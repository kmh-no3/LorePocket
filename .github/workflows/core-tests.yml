name: Core tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2.1"
      - name: Test LorePocketCore
        run: swift test --package-path LorePocketCore
